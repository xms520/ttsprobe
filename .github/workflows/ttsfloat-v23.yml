name: build-ttsfloat-v23

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "TTSFloat_v23.m"
      - "TTSFloat_v23.yml"
      - ".github/workflows/ttsfloat-v23.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid || true

      - name: Build TTSFloat_v23 dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit -framework AVFoundation -framework CoreGraphics \
            -o TTSFloat_v23.dylib \
            TTSFloat_v23.m fishhook.c

      - name: Fake-sign with ldid
        run: ldid -S TTSFloat_v23.dylib || true

      - name: Show result
        run: |
          ls -la TTSFloat_v23.dylib
          file TTSFloat_v23.dylib

      - name: Compute md5
        run: |
          md5 TTSFloat_v23.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTSFloat-v23-dylib
          path: TTSFloat_v23.dylib

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TTSFloat_v23.dylib
          name: TTSFloat_v23 Release