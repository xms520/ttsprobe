name: build-dylib

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Build dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe.dylib \
            TTSProbe.m

      - name: Build VC2 dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_VC2.dylib \
            TTSProbe_VC2.m

      - name: Build TTSFloat final dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit -framework AVFoundation \
            -o TTSFloat.dylib \
            TTSFloatFinal.m

      - name: Build TTSFloat v4 dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit -framework AVFoundation -framework CoreGraphics \
            -o TTSFloat_v4.dylib \
            TTSFloat_v4.m

      - name: Build TTSProbe v5 dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_v5.dylib \
            TTSProbe_v5.m

      - name: Build TTSProbe v7 dylib (no-hook safe probe)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_v7.dylib \
            TTSProbe_v7.m

      - name: Build TTSProbe v8 dylib (prepareSend only)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_v8.dylib \
            TTSProbe_v8.m
      - name: Build TTSProbe v8b dylib (file-log)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_v8b.dylib \
            TTSProbe_v8b.m
      - name: Build TTSProbe v9 dylib (voice data feed probe)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_v9.dylib \
            TTSProbe_v9.m
      - name: Build TTSFloat v10 final dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation -framework UIKit -framework AVFoundation -framework CoreGraphics \
            -o TTSFloat_v10.dylib \
            TTSFloat_v10.m
      - name: Build TTSProbe v11 dylib (upload queue probe)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_v11.dylib \
            TTSProbe_v11.m
      - name: Build TTSProbe v11b dylib (fixed sig upload probe)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_v11b.dylib \
            TTSProbe_v11b.m
      - name: Build TTSProbe v12 dylib (C-IMP upload probe)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_v12.dylib \
            TTSProbe_v12.m

      - name: Sign with ldid (fake sign)
        run: |
          ldid -S TTSProbe.dylib || true
          ldid -S TTSProbe_VC2.dylib || true
          ldid -S TTSFloat.dylib || true
          ldid -S TTSFloat_v4.dylib || true
          ldid -S TTSProbe_v5.dylib || true
          ldid -S TTSProbe_v7.dylib || true
          ldid -S TTSProbe_v8.dylib || true
          ldid -S TTSProbe_v8b.dylib || true
          ldid -S TTSProbe_v9.dylib || true
          ldid -S TTSFloat_v10.dylib || true
          ldid -S TTSProbe_v11.dylib || true
          ldid -S TTSProbe_v11b.dylib || true
          ldid -S TTSProbe_v12.dylib || true

      - name: Show result
        run: |
          ls -la *.dylib
          file *.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTSProbe-dylibs
          path: |
            TTSProbe.dylib
            TTSProbe_VC2.dylib
            TTSFloat.dylib
            TTSFloat_v4.dylib
            TTSProbe_v5.dylib
            TTSProbe_v7.dylib
            TTSProbe_v8.dylib
            TTSProbe_v8b.dylib
            TTSProbe_v9.dylib
            TTSFloat_v10.dylib
            TTSProbe_v11.dylib
            TTSProbe_v11b.dylib
            TTSProbe_v12.dylib

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TTSProbe.dylib
