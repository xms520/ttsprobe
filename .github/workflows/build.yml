name: build-dylib

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Build dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe.dylib \
            TTSProbe.m

      - name: Build VC2 dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit \
            -o TTSProbe_VC2.dylib \
            TTSProbe_VC2.m

      - name: Build TTSFloat final dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -dynamiclib \
            -framework Foundation -framework UIKit -framework AVFoundation \
            -o TTSFloat.dylib \
            TTSFloatFinal.m

      - name: Sign with ldid (fake sign)
        run: |
          ldid -S TTSProbe.dylib || true
          ldid -S TTSProbe_VC2.dylib || true
          ldid -S TTSFloat.dylib || true

      - name: Show result
        run: |
          ls -la TTSProbe.dylib TTSProbe_VC2.dylib TTSFloat.dylib
          file TTSProbe.dylib TTSProbe_VC2.dylib TTSFloat.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTSProbe-dylibs
          path: |
            TTSProbe.dylib
            TTSProbe_VC2.dylib
            TTSFloat.dylib

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TTSProbe.dylib
